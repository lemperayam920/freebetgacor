<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin & Menang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange: #ff6b1a;
    --orange-deep: #d64d00;
    --cream: #fff4e6;
    --teal: #0fbfa8;
    --pink: #ff4f8b;
    --purple: #7c5cff;
    --ink: #2a1607;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100vh; width:100%;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,107,26,0.25), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(124,92,255,0.25), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(15,191,168,0.18), transparent 50%),
      #fff8ef;
    font-family:'Poppins', sans-serif;
    overflow-x:hidden;
    display:flex; flex-direction:column; align-items:center;
    color:var(--ink);
    position:relative;
  }
  .display{ font-family:'Baloo 2', sans-serif; }

  /* ===== Header / brand ===== */
  .brand{
    margin-top:30px; text-align:center; z-index:2;
  }
  .brand .tag{
    letter-spacing:.35em; font-size:11px; color:var(--teal);
    text-transform:uppercase; font-weight:700;
  }
  .brand h1{
    font-size:clamp(30px,7vw,50px);
    margin-top:6px;
    background:linear-gradient(180deg,#ffb066,var(--orange) 55%, var(--orange-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 3px 0 rgba(214,77,0,.15);
    letter-spacing:.01em;
  }
  .brand p{
    max-width:480px; margin:10px auto 0; font-size:14px; color:#6b4a2f; line-height:1.6;
  }

  /* ===== Wheel stage ===== */
  .wheel-stage{
    position:relative;
    width:min(88vw, 400px);
    height:min(88vw, 400px);
    margin:34px auto 6px;
    z-index:2;
    perspective:1200px;
  }
  .wheel-shadow{
    position:absolute; bottom:-14px; left:50%; transform:translateX(-50%);
    width:80%; height:24px;
    background:radial-gradient(ellipse, rgba(90,50,10,0.35), transparent 70%);
    filter:blur(4px);
  }
  .pointer{
    position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    width:42px; height:52px; z-index:6;
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.25));
  }
  .rim-outer{
    position:absolute; inset:0; border-radius:50%;
    background: conic-gradient(from 0deg, #ffd8a8, var(--orange) 12%, var(--orange-deep) 24%, var(--orange) 36%, #ffd8a8 48%, var(--orange) 60%, var(--orange-deep) 72%, var(--orange) 84%, #ffd8a8 100%);
    box-shadow: 0 0 0 6px #b84400 inset, 0 16px 34px rgba(214,77,0,.35), 0 0 30px rgba(255,107,26,.25);
  }
  .rim-dots{ position:absolute; inset:8px; border-radius:50%; }
  .dot{
    position:absolute; width:8px; height:8px; border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #fff, var(--cream) 60%, #ffcf99);
    box-shadow:0 0 6px 1px rgba(255,255,255,.8);
    animation: twinkle 1.3s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.35;transform:scale(.75);} }

  .wheel-frame{
    position:absolute; inset:20px; border-radius:50%;
    box-shadow:0 0 0 4px #ffe4c2 inset, 0 6px 16px rgba(0,0,0,.12) inset;
    overflow:hidden; transform-style:preserve-3d; background:#fff;
  }
  #wheel{
    position:absolute; inset:0; border-radius:50%;
    transform-origin:50% 50%;
    transition: transform 4.6s cubic-bezier(0.17,0.67,0.18,1.005);
    box-shadow: inset 0 0 24px rgba(0,0,0,.12), inset 0 0 4px 2px rgba(255,255,255,.4);
  }
  .label-wrap{ position:absolute; width:2px; height:50%; left:50%; top:0; transform-origin:50% 100%; }
  .label-wrap .label{
    position:absolute; top:14%; left:50%; transform:translateX(-50%);
    font-family:'Baloo 2'; font-weight:700; font-size:12.5px; color:#fff;
    text-shadow:0 2px 3px rgba(0,0,0,.35);
    white-space:nowrap; text-align:center;
  }

  .hub{
    position:absolute; top:50%; left:50%; width:22%; height:22%;
    transform:translate(-50%,-50%); border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--cream) 40%, #ffb066 90%);
    box-shadow:0 4px 10px rgba(0,0,0,.2), 0 0 0 3px #ffe4c2;
    z-index:5; display:flex; align-items:center; justify-content:center;
  }
  .hub::after{ content:"★"; color:var(--purple); font-size:20px; }

  #spinBtn{
    margin-top:40px; padding:15px 50px; font-size:18px;
    font-family:'Baloo 2'; font-weight:700; letter-spacing:.05em;
    text-transform:uppercase; color:#fff; border:none; border-radius:50px;
    background: linear-gradient(180deg, #ff9152, var(--orange) 45%, var(--orange-deep));
    box-shadow: 0 7px 0 #9c3a00, 0 12px 20px rgba(214,77,0,.35);
    cursor:pointer; position:relative; z-index:2;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  #spinBtn:active{ transform:translateY(6px); box-shadow:0 1px 0 #9c3a00; }
  #spinBtn:disabled{ opacity:.55; cursor:not-allowed; filter:grayscale(.25); }

  .footer-note{ margin:20px 0 40px; font-size:12px; color:#9a8067; letter-spacing:.03em; z-index:2; }

  /* ===== Popup ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(40,20,5,0.55);
    backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .overlay.show{ display:flex; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  .popup{
    width:min(90vw,360px);
    background: linear-gradient(180deg,#fffaf3,#fff1e0);
    border-radius:22px; padding:30px 24px 26px; text-align:center; position:relative;
    box-shadow: 0 25px 50px rgba(0,0,0,.25), 0 0 0 3px var(--orange);
    transform: scale(.75); animation: popIn .5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes popIn{ to{ transform: scale(1);} }

  .popup h2{
    margin:4px 0 0; font-family:'Baloo 2'; font-size:15px; letter-spacing:.15em;
    color:var(--pink); text-transform:uppercase;
  }
  .popup .congrats{ font-size:20px; margin:8px 0 4px; }

  .prize-box{
    width:120px; height:120px; margin:14px auto 10px; border-radius:26px;
    background: radial-gradient(circle at 35% 30%, #fff, var(--cream) 45%, #ffcf99 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 22px rgba(214,77,0,.25), inset 0 3px 8px rgba(255,255,255,.7);
    font-size:46px;
    animation: pop3d 1s ease-out;
  }
  @keyframes pop3d{ from{ transform: rotateY(360deg) scale(.4); opacity:0;} to{ transform: rotateY(0) scale(1); opacity:1;} }

  .popup .prize-name{
    font-family:'Baloo 2'; font-weight:700; font-size:24px; margin:4px 0 16px; color:var(--ink);
  }
  .popup .instr{ font-size:12.5px; color:#7a5a3d; line-height:1.6; margin-bottom:20px; }

  #claimBtn{
    display:inline-block; width:100%; padding:14px 0; font-size:16px;
    font-family:'Baloo 2'; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    color:#fff; text-decoration:none; border:none; border-radius:14px; cursor:pointer;
    background: linear-gradient(180deg,#2fe0c9,var(--teal) 60%, #0a9384);
    box-shadow: 0 6px 0 #076f63, 0 10px 16px rgba(0,0,0,.2);
    transition: transform .08s ease;
  }
  #claimBtn:active{ transform:translateY(5px); box-shadow:0 1px 0 #076f63; }

  .close-x{
    position:absolute; top:12px; right:16px; color:#c99a72; font-size:20px; cursor:pointer; line-height:1;
  }
  .close-x:hover{ color:var(--orange-deep); }

  .confetti{
    position:fixed; top:-10px; z-index:60; width:8px; height:14px; opacity:.95;
    animation: fall linear forwards;
  }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); opacity:.2; } }
</style>
</head>
<body>

<div class="brand">
  <div class="tag">FREEBET x Bondep</div>
  <h1 class="display">Spin &amp; Menang!</h1>
  <p>Putar roda sekali dan menangkan Saldo sampai dengan Rp250.000.</p>
</div>

<div class="wheel-stage">
  <div class="wheel-shadow"></div>

  <svg class="pointer" viewBox="0 0 46 56">
    <polygon points="23,56 2,10 44,10" fill="var(--pink)" stroke="#fff" stroke-width="3" style="filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));"/>
    <circle cx="23" cy="10" r="9" fill="#fff" stroke="var(--pink)" stroke-width="2"/>
  </svg>

  <div class="rim-outer"><div class="rim-dots" id="rimDots"></div></div>
  <div class="wheel-frame"><div id="wheel"></div></div>
  <div class="hub"></div>
</div>

<button id="spinBtn">PUTAR SEKARANG</button>
<div class="footer-note">1 kali kesempatan spin per pengunjung</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <span class="close-x" id="closeX">&times;</span>
    <h2>SELAMAT ANDA MENANG</h2>
    <div class="congrats display">🎉</div>
    <div class="prize-box" id="prizeIcon">🎁</div>
    <div class="prize-name display" id="prizeName">Stiker Pack</div>
    <p class="instr">Silahkan screenshot halaman ini dan kirim ke admin untuk klaim hadiahmu.</p>
    <a href="#" id="claimBtn">CLAIM!!</a>
  </div>
</div>

<script>
  // ============ KONFIGURASI — GAMPANG DIGANTI ============
  // Ganti nomor WA di bawah (format: 62xxxxxxxxxx, tanpa + atau 0 di depan)
  const WA_NUMBER = "shaqqphuc";

  const prizes = [
    { label: "Rp50.000\nSaldo",      icon: "💵", weight: 5 },
    { label: "Rp100.000\nSaldo",   icon: "💴", weight: 5 },
    { label: "Rp150.000\nSaldo",      icon: "💶", weight: 10 },
    { label: "Rp200.000\nSaldo",      icon: "💷", weight: 10  },
    { label: "Rp225.000\nSaldo",    icon: "💰", weight: 30 },
    { label: "Rp250.000\nJackpot",  icon: "💎", weight: 40 },
  ];
  const segmentColors = ["#ff6b1a", "#7c5cff", "#0fbfa8", "#ff4f8b", "#ffb020", "#3ea6ff"];
  // =========================================================

  const wheelEl = document.getElementById('wheel');
  const segAngle = 360 / prizes.length;

  let gradientStops = [];
  prizes.forEach((p, i) => {
    const start = i * segAngle, end = (i+1) * segAngle;
    gradientStops.push(`${segmentColors[i % segmentColors.length]} ${start}deg ${end}deg`);
  });
  wheelEl.style.background = `conic-gradient(from 0deg, ${gradientStops.join(', ')})`;

  prizes.forEach((p, i) => {
    const divider = document.createElement('div');
    Object.assign(divider.style, {
      position:'absolute', top:'0', left:'50%', width:'2px', height:'50%',
      background:'rgba(255,255,255,0.55)', transformOrigin:'50% 100%',
      transform:`rotate(${i*segAngle}deg)`
    });
    wheelEl.appendChild(divider);
  });

  prizes.forEach((p, i) => {
    const centerAngle = i * segAngle + segAngle/2;
    const wrap = document.createElement('div');
    wrap.className = 'label-wrap';
    wrap.style.transform = `rotate(${centerAngle}deg)`;
    const label = document.createElement('div');
    label.className = 'label';
    label.innerHTML = p.label.replace('\n','<br>');
    wrap.appendChild(label);
    wheelEl.appendChild(wrap);
  });

  function placeDots(container, count, radius){
    for(let i=0;i<count;i++){
      const angle = (i/count) * 2 * Math.PI;
      const x = 50 + radius*Math.cos(angle), y = 50 + radius*Math.sin(angle);
      const d = document.createElement('div');
      d.className = 'dot';
      d.style.left = x+'%'; d.style.top = y+'%';
      d.style.animationDelay = (i%2===0 ? '0s':'0.5s');
      container.appendChild(d);
    }
  }
  placeDots(document.getElementById('rimDots'), 18, 48);

  const spinBtn = document.getElementById('spinBtn');
  const overlay = document.getElementById('overlay');
  const prizeNameEl = document.getElementById('prizeName');
  const prizeIconEl = document.getElementById('prizeIcon');
  const claimBtn = document.getElementById('claimBtn');
  const closeX = document.getElementById('closeX');

  let currentRotation = 0;
  let spinning = false;
  let wonPrizeLabel = "";
  const STORAGE_KEY = 'chitatoWheelHasSpun';

  function hasAlreadySpun(){ try{ return localStorage.getItem(STORAGE_KEY)==='1'; }catch(e){ return false; } }
  function markAsSpun(){ try{ localStorage.setItem(STORAGE_KEY,'1'); }catch(e){} }
  function lockSpinButton(){ spinBtn.disabled = true; spinBtn.textContent = 'KESEMPATAN SUDAH DIPAKAI'; }
  if(hasAlreadySpun()) lockSpinButton();

  function getWeightedWinner(){
    const total = prizes.reduce((s,p)=>s+p.weight,0);
    let r = Math.random()*total;
    for(let i=0;i<prizes.length;i++){
      if(r < prizes[i].weight) return i;
      r -= prizes[i].weight;
    }
    return 0;
  }

  function spinWheel(){
    if(spinning || hasAlreadySpun()) return;
    spinning = true;
    spinBtn.disabled = true;
    spinBtn.textContent = 'MEMUTAR...';

    const winnerIndex = getWeightedWinner();
    const targetSegmentCenter = winnerIndex * segAngle + segAngle/2;
    const extraSpins = 6 + Math.floor(Math.random()*3);
    const finalRotation = currentRotation + (extraSpins*360) + (360 - targetSegmentCenter) - (currentRotation % 360);
    currentRotation = finalRotation;
    wheelEl.style.transform = `rotate(${finalRotation}deg)`;

    setTimeout(() => {
      showPrize(prizes[winnerIndex]);
      spinning = false;
      markAsSpun();
      lockSpinButton();
    }, 4700);
  }

  function showPrize(prize){
    const flat = prize.label.replace('\n',' ');
    wonPrizeLabel = flat;
    prizeNameEl.textContent = flat;
    prizeIconEl.textContent = prize.icon;
    overlay.classList.add('show');
    launchConfetti();

    const msg = encodeURIComponent(`Halo admin, saya baru saja spin dan mendapatkan hadiah: ${flat}.`);
    claimBtn.href = `https://t.me/${WA_NUMBER}?text=${msg}`;
  }

  function closePopup(){ overlay.classList.remove('show'); }
  spinBtn.addEventListener('click', spinWheel);
  closeX.addEventListener('click', closePopup);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closePopup(); });

  function launchConfetti(){
    const colors = ['#ff6b1a','#7c5cff','#0fbfa8','#ff4f8b','#ffb020','#3ea6ff'];
    for(let i=0;i<60;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random()*100+'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (2.5+Math.random()*2)+'s';
      c.style.animationDelay = (Math.random()*0.6)+'s';
      c.style.borderRadius = Math.random()>0.5 ? '50%':'2px';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 5000);
    }
  }
</script>
</body>
</html>
